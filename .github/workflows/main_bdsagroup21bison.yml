# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - bdsagroup21bison

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      
      - name: Install Z3
        run: |
          sudo apt update
          sudo apt install -y z3
          z3 --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Verify Dafny code
        run: dotnet dafny verify src/Bison.Infrastructure/Dafny/TaxonFilter.dfy

      - name: Translate Dafny code
        run: dotnet dafny translate cs --include-runtime --output src/Bison.Infrastructure/Dafny/Generated/TaxonFilter src/Bison.Infrastructure/Dafny/TaxonFilter.dfy

      - name: Build with dotnet
        run: dotnet build src/Bison.Razor/ --configuration Release

      - name: Test
        run: dotnet test Bison.sln --configuration Release

      - name: dotnet publish
        run: dotnet publish src/Bison.Razor/ -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_62813B4638FD4E2D931B6F13101C1D62 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D2F484ADE3B9495AB0732252FDA5EF4F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_25BA75A75F324B67A6FECDE61A573F79 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bdsagroup21bison'
          slot-name: 'Production'
          package: .
          
